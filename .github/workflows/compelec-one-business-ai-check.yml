name: COMPELEC ONE Business AI – Python und PostgreSQL-Prüfung

on:
  push:
    branches:
      - compelec-one-business-ai-v1.0
  pull_request:
    branches:
      - compelec-one-business-ai-v1.0

jobs:
  python-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compelec_one_business_ai_v1
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Python-Syntax prüfen
        run: python -m compileall -q .
      - name: Datenzugriffsschicht – Unit-Tests
        run: python -m unittest discover -s tests -v

  postgres-rls-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compelec_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d compelec_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: PostgreSQL-Schema einspielen
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d compelec_test -v ON_ERROR_STOP=1 -f compelec_one_business_ai_v1/database/schema_v1_1.sql
      - name: Mandantentrennung mit zwei Testmandanten prüfen
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d compelec_test -v ON_ERROR_STOP=1 -f compelec_one_business_ai_v1/tests/rls_tenant_isolation.sql
