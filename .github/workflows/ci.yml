name: COMPELEC ONE Business CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main
      - agent/ccs-agent-support-mvp
      - agent/ccs-agent-support-v0.3-architecture
      - agent/compelec-one-business-v0.4
      - agent/compelec-one-business-v1.0
      - agent/compelec-one-business-v1.1-readiness
      - agent/compelec-one-business-v1.2

permissions:
  contents: read

concurrency:
  group: compelec-one-business-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ccs
          POSTGRES_PASSWORD: ccs-test-password
          POSTGRES_DB: ccs_support
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ccs -d ccs_support"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CCS_TEST_POSTGRES_URL: postgresql://ccs:ccs-test-password@127.0.0.1:5432/ccs_support
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python sources
        run: >-
          python -m py_compile
          architecture.py embedding.py identity.py postgres_migrations.py postgres_repository.py
          support_service.py v03_runtime.py api_v04.py api_v1.py production_config.py reembed_v04.py
          migrate_v02_sqlite_to_v03_postgres.py backup_restore.py launch_compelec_one.py
          ccs_core.py knowledge_ai.py streamlit_app.py streamlit_v03.py system_diagnostics.py
      - name: Run unit and PostgreSQL integration tests
        run: python -m unittest discover -s tests -v
      - name: Build tested source bundle
        run: |
          VERSION=$(cat VERSION | tr -d '\r\n')
          git archive --format=zip --output "COMPELEC-ONE-Business-${VERSION}-source.zip" HEAD
          sha256sum "COMPELEC-ONE-Business-${VERSION}-source.zip" > SHA256SUMS-source.txt
      - name: Upload tested source artifact
        uses: actions/upload-artifact@v4
        with:
          name: compelec-one-business-v1.2-source
          path: |
            COMPELEC-ONE-Business-*-source.zip
            SHA256SUMS-source.txt
          if-no-files-found: error
          retention-days: 30

  windows-build:
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer and portable package
        shell: pwsh
        run: ./packaging/windows/build_windows.ps1
      - name: Smoke-test Windows installation and uninstallation
        shell: pwsh
        run: |
          $Setup = Get-ChildItem "release/windows/*Setup*.exe" | Select-Object -First 1
          if (-not $Setup) { throw "Windows-Setup-EXE fehlt." }
          $InstallDir = Join-Path $env:RUNNER_TEMP "COMPELEC-ONE-Business-Smoke"
          & $Setup.FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/DIR=$InstallDir"
          if ($LASTEXITCODE -ne 0) { throw "Windows-Installation fehlgeschlagen: $LASTEXITCODE" }
          $InstalledExe = Join-Path $InstallDir "COMPELEC-ONE-Business.exe"
          if (-not (Test-Path $InstalledExe)) { throw "Installierte Programmdatei fehlt." }
          $Uninstaller = Join-Path $InstallDir "unins000.exe"
          if (-not (Test-Path $Uninstaller)) { throw "Uninstaller wurde nicht installiert." }
          & $Uninstaller /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { throw "Deinstallation fehlgeschlagen: $LASTEXITCODE" }
          if (Test-Path $InstalledExe) { throw "Programmdatei wurde bei Deinstallation nicht entfernt." }
      - name: Upload Windows test release
        uses: actions/upload-artifact@v4
        with:
          name: compelec-one-business-windows-test
          path: |
            release/windows/*.exe
            release/windows/*.zip
            release/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
