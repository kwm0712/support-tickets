name: Development Center CI

on:
  push:
    paths:
      - "development_center/**"
      - ".github/workflows/devcenter-ci.yml"
  pull_request:
    paths:
      - "development_center/**"
      - ".github/workflows/devcenter-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: development_center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: development_center/pyproject.toml
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
