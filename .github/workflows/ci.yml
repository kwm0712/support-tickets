name: CCS Support CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main
      - agent/ccs-agent-support-mvp

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ccs
          POSTGRES_PASSWORD: ccs-test-password
          POSTGRES_DB: ccs_support
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ccs -d ccs_support"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CCS_TEST_POSTGRES_URL: postgresql://ccs:ccs-test-password@127.0.0.1:5432/ccs_support
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python sources
        run: >-
          python -m py_compile
          architecture.py embedding.py ccs_core.py knowledge_ai.py streamlit_app.py

      - name: Run unit and PostgreSQL integration tests
        run: python -m unittest discover -s tests -v
