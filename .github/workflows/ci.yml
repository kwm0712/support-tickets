name: CCS Support CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main
      - agent/ccs-agent-support-mvp

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ccs
          POSTGRES_PASSWORD: ccs-test-password
          POSTGRES_DB: ccs_support
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ccs -d ccs_support"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CCS_TEST_POSTGRES_URL: postgresql://ccs:ccs-test-password@127.0.0.1:5432/ccs_support
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python sources
        run: >-
          python -m py_compile
          architecture.py embedding.py postgres_migrations.py postgres_repository.py
          support_service.py v03_runtime.py migrate_v02_sqlite_to_v03_postgres.py
          ccs_core.py knowledge_ai.py streamlit_app.py streamlit_v03.py

      - name: Run unit and PostgreSQL integration tests
        run: python -m unittest discover -s tests -v

      - name: Build tested source bundle
        run: |
          git archive --format=zip --output CCS-Agent-Support-V0.3.0-dev-Phase2.zip HEAD
          sha256sum CCS-Agent-Support-V0.3.0-dev-Phase2.zip > SHA256SUMS.txt

      - name: Upload tested release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccs-agent-support-v03-phase2
          path: |
            CCS-Agent-Support-V0.3.0-dev-Phase2.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
