name: Pfarrbüro-KI V2.0 Windows Build
on:
  push:
    branches:
      - agent/pfarrbuero-ki-v2.0-enterprise-core
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and packaging dependencies
        run: python -m pip install --upgrade pip && pip install -r pfarrbuero/requirements.txt
      - name: Compile Python sources
        run: python -m py_compile pfarrbuero/app.py pfarrbuero/repository.py
      - name: Build EXE
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name COMPELEC_ONE_Pfarrbuero_KI pfarrbuero/app.py
      - name: Launch EXE and verify startup
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist/COMPELEC_ONE_Pfarrbuero_KI.exe"
          if (!(Test-Path $exe)) { throw "EXE missing" }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw "Pfarrbüro-KI EXE exited during startup (ExitCode=$($process.ExitCode))" }
          Stop-Process -Id $process.Id -Force
          Get-FileHash $exe -Algorithm SHA256 | Out-File "dist/COMPELEC_ONE_Pfarrbuero_KI_V2.0_EXE_SHA256.txt"
      - name: Build Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "pfarrbuero/installer.iss"
      - name: Verify setup and checksum
        shell: pwsh
        run: |
          $setup = "dist/COMPELEC_ONE_Pfarrbuero_KI_V2.0_Setup.exe"
          if (!(Test-Path $setup)) { throw "Setup missing: $setup" }
          Get-FileHash $setup -Algorithm SHA256 | Out-File "dist/COMPELEC_ONE_Pfarrbuero_KI_V2.0_Setup_SHA256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: COMPELEC_ONE_Pfarrbuero_KI_V2.0_Windows_preview
          path: |
            dist/COMPELEC_ONE_Pfarrbuero_KI.exe
            dist/COMPELEC_ONE_Pfarrbuero_KI_V2.0_Setup.exe
            dist/*SHA256.txt
          if-no-files-found: error
          retention-days: 30
